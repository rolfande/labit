name: Registrer et laboratorium
description: Registrer et nytt sikkert laboratorieoppsett og spor oppgavene som må gjøres.
title: "[Lab] "
labels: ["lab"]
body:
  - type: input
    id: forskningsgruppe
    attributes:
      label: Forskningsgruppe
      description: Hvilken forskningsgruppe gjelder laboratoriet?
    validations:
      required: true

  - type: input
    id: kortnavn
    attributes:
      label: Kortnavn
      description: Kort, gjenkjennelig navn på laboratoriet
    validations:
      required: true

  - type: input
    id: kontaktperson
    attributes:
      label: Kontaktperson
      description: Hvem er kontaktperson for laboratoriet?
    validations:
      required: true

  - type: input
    id: dataeier
    attributes:
      label: Dataeier
      description: Hvem eier dataene som håndteres i laboratoriet?
    validations:
      required: true

  - type: dropdown
    id: klassifisering
    attributes:
      label: Klassifisering
      description: Dataklassifisering for laboratoriet
      options:
        - grønn
        - gul
        - rød
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - planlagt
        - pågår
        - fullført
        - på vent
      default: 0
    validations:
      required: true

  - type: textarea
    id: beskrivelse
    attributes:
      label: Beskrivelse
      description: Hva skal laboratoriet brukes til / hvilke data eller systemer berøres?
    validations:
      required: false

  - type: textarea
    id: oppgaver
    attributes:
      label: Oppgaver
      description: >
        Én oppgave per linje som en GitHub-sjekkliste. Bruk `@brukernavn` for å tildele noen.
        GitHub viser fremdriften direkte på saken etter hvert som boksene hukes av.
      value: |
        - [ ] Nettverkssegmentering (VLAN) — @ansvarlig
        - [ ] Gjennomgang av brannmurregler — @ansvarlig
        - [ ] Herding av klienter — @ansvarlig
        - [ ] Oppsett av tilgangskontroll — @ansvarlig
    validations:
      required: true
